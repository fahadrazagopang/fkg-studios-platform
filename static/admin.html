<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - FKG STUDIOS</title>
    <style>
        :root { --bg-color: #0b0c10; --card-bg: #1f2833; --neon-blue: #45f3ff; --text-main: #c5c6c7; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; }
        .container { background: var(--card-bg); padding: 40px; border-radius: 10px; width: 100%; max-width: 500px; box-shadow: 0 0 20px rgba(0,0,0,0.5); border: 1px solid #333; }
        h2 { color: #fff; text-align: center; margin-bottom: 30px; text-shadow: 0 0 10px var(--neon-blue); letter-spacing: 2px;}
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--neon-blue); font-size: 0.9rem; }
        input[type="text"], input[type="password"], select, textarea, input[type="file"] { width: 100%; padding: 12px; border-radius: 5px; background: var(--bg-color); color: #fff; border: 1px solid #444; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--neon-blue); box-shadow: 0 0 8px rgba(69, 243, 255, 0.3); }
        .btn-submit { width: 100%; padding: 15px; background: transparent; color: var(--neon-blue); border: 2px solid var(--neon-blue); border-radius: 5px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; text-transform: uppercase; }
        .btn-submit:hover { background: var(--neon-blue); color: var(--bg-color); box-shadow: 0 0 15px var(--neon-blue); }
        .hidden { display: none !important; }
        #custom-alert, #error-alert { position: fixed; top: 20px; right: 20px; color: white; padding: 15px 30px; border-radius: 5px; transform: translateX(200%); transition: transform 0.5s ease; font-weight: bold; z-index: 1000; }
        #custom-alert { background: #28a745; box-shadow: 0 0 15px rgba(40, 167, 69, 0.6); }
        #error-alert { background: #dc3545; box-shadow: 0 0 15px rgba(220, 53, 69, 0.6); }
        #custom-alert.show, #error-alert.show { transform: translateX(0); }
    </style>
</head>
<body>
    <div id="custom-alert">Upload Successful! Redirecting...</div>
    <div id="error-alert">Error occurred.</div>

    <div class="container" id="login-container">
        <h2>ADMIN LOGIN</h2>
        <form id="login-form">
            <div class="form-group"><label>Username</label><input type="text" id="username" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" required></div>
            <button type="submit" class="btn-submit">System Login</button>
        </form>
    </div>

    <div class="container hidden" id="upload-container">
        <h2>UPLOAD MANAGER</h2>
        <form id="upload-form">
            <div class="form-group"><label>Post / Asset Title</label><input type="text" id="title" required placeholder="e.g. Premium Auto-Clicker Script"></div>
            <div class="form-group"><label>Asset Type</label><select id="asset_type" required><option value="APK">Android App (.apk)</option><option value="Script">Python Script (.py)</option></select></div>
            <div class="form-group"><label>Description</label><textarea id="description" required placeholder="Describe what it does..."></textarea></div>
            <div class="form-group"><label>Select File</label><input type="file" id="file_input" required></div>
            <button type="submit" class="btn-submit">Publish Asset</button>
        </form>
    </div>

    <script>
        const loginContainer = document.getElementById('login-container');
        const uploadContainer = document.getElementById('upload-container');
        const customAlert = document.getElementById('custom-alert');
        const errorAlert = document.getElementById('error-alert');

        function showError(msg) { errorAlert.innerText = msg; errorAlert.classList.add('show'); setTimeout(() => errorAlert.classList.remove('show'), 3000); }
        function showSuccess() { customAlert.classList.add('show'); setTimeout(() => { window.location.href = '/'; }, 2000); }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const formData = new FormData();
            formData.append('username', user);
            formData.append('password', pass);

            try {
                const response = await fetch('/api/login', { method: 'POST', body: formData });
                if (response.ok) {
                    sessionStorage.setItem('adminUser', user);
                    sessionStorage.setItem('adminPass', pass);
                    loginContainer.classList.add('hidden');
                    uploadContainer.classList.remove('hidden');
                } else { showError("Access Denied: Invalid Credentials"); }
            } catch (err) { showError("Server Connection Error"); }
        });

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Publishing..."; btn.disabled = true;

            const formData = new FormData();
            formData.append('username', sessionStorage.getItem('adminUser'));
            formData.append('password', sessionStorage.getItem('adminPass'));
            formData.append('title', document.getElementById('title').value);
            formData.append('asset_type', document.getElementById('asset_type').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('file', document.getElementById('file_input').files[0]);

            try {
                const response = await fetch('/api/upload', { method: 'POST', body: formData });
                if (response.ok) { showSuccess(); } 
                else { showError("Upload Failed."); btn.innerText = "Publish Asset"; btn.disabled = false; }
            } catch (err) { showError("Network error."); btn.innerText = "Publish Asset"; btn.disabled = false; }
        });
    </script>
</body>
</html>
